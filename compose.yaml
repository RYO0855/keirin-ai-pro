services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KEIRIN_API_KEY: ${KEIRIN_API_KEY:?Set an API key with at least 32 characters}
      KEIRIN_ALLOWED_ORIGINS: ${KEIRIN_ALLOWED_ORIGINS:-https://ryo0855.github.io}
      KEIRIN_DB: /data/keirin.sqlite
    volumes:
      - keirin-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
volumes:
  keirin-data:
