<script>
// 既存の競輪分析アプリへ実データ接続を追加します。
if(!document.querySelector('#loadLive')){
const opt=document.createElement('option');opt.value='live';opt.textContent='実取得（yomisuji）';document.querySelector('#source').append(opt);
const load=document.createElement('button');load.id='loadLive';load.className='primary';load.textContent='実データを取得';document.querySelector('#export').before(load);
const status=document.createElement('p');status.id='liveStatus';status.className='muted';status.setAttribute('role','status');status.textContent='実データは操作時に取得します。更新日時は不明です。';document.querySelector('#provenance').before(status);
const nav=document.createElement('button');nav.dataset.tab='observations';nav.textContent='連係記録';document.querySelector('[data-tab="data"]').before(nav);
const css=document.createElement('style');css.textContent='.layout>div,.layout>aside,.card,.stat{min-width:0}.controls label{max-width:100%}#message{pointer-events:none}#liveStatus{overflow-wrap:anywhere}';document.head.append(css);
document.querySelector('header .badge').textContent='実データ取得対応 / オッズ未接続';
}
db=function(){return source==='live'?live:source==='sample'?sample:imported};
$('#date').onchange=()=>render();$('#region').onchange=()=>render();
// 観測スコアを的中確率に変換しません。
const PROVIDER='https://keirin.yomisuji.jp', LIVE_STORE='keirin-evidence-v1';
let live={races:[],history:[],bets:[]},liveMeta={fetchedAt:null,lastModified:null,error:null},detailState={},indexBusy=false;
let evidence={version:1,profiles:[],observations:[]};
const regionsByPref={};
Object.entries({'北日本':['北海道','青森','岩手','宮城','秋田','山形','福島'],'関東':['茨城','栃木','群馬','埼玉','東京','新潟','長野','山梨'],'南関東':['千葉','神奈川','静岡'],'中部':['愛知','岐阜','三重','富山','石川'],'近畿':['福井','滋賀','京都','大阪','兵庫','奈良','和歌山'],'中国':['鳥取','島根','岡山','広島','山口'],'四国':['徳島','香川','愛媛','高知'],'九州':['福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄']}).forEach(([r,p])=>p.forEach(x=>regionsByPref[x]=r));
const venueRegion={};
Object.entries({'北日本':['函館','青森','いわき平'],'関東':['弥彦','前橋','取手','宇都宮','大宮','西武園','京王閣','立川'],'南関東':['松戸','千葉','川崎','平塚','小田原','伊東','静岡'],'中部':['名古屋','岐阜','大垣','豊橋','富山','松阪','四日市'],'近畿':['福井','奈良','向日町','和歌山','岸和田'],'中国':['玉野','広島','防府'],'四国':['高松','小松島','高知','松山'],'九州':['小倉','久留米','武雄','佐世保','別府','熊本']}).forEach(([r,v])=>v.forEach(x=>venueRegion[x]=r));
function rateKnown(rows,key){const known=rows.filter(x=>typeof x[key]==='boolean');return {n:known.length,value:known.length?known.filter(x=>x[key]).length/known.length:null}}
function profile(id){return evidence.profiles.find(x=>x.id===id)}
function sameRegion(a,b){return a&&b&&regionsByPref[a]&&regionsByPref[b]?regionsByPref[a]===regionsByPref[b]:null}
function checkEvidence(d){if(!d||d.version!==1||!Array.isArray(d.profiles)||!Array.isArray(d.observations)||d.profiles.length>20000||d.observations.length>30000)fail('観測記録形式が不正です');if(!unique(d.profiles,x=>x.id)||!unique(d.observations,x=>x.id))fail('観測記録IDが重複しています');for(const p of d.profiles){if(!/^\d{6}$/.test(p.id)||!text(p.name)||!regionsByPref[p.prefecture]||!text(p.source))fail('選手情報にID・名前・所属県・出典が必要です')}
for(const o of d.observations){if(!text(o.id)||!/^\w[\w-]*$/.test(o.raceId)||!day(o.date)||!/^\d{6}$/.test(o.leader)||!/^\d{6}$/.test(o.follower)||o.leader===o.follower||!Number.isInteger(o.position)||o.position<2||o.position>9||!text(o.source)||!time(o.observedAt))fail('連係記録が不正です');for(const k of ['followed','dropped'])if(o[k]!==null&&typeof o[k]!=='boolean')fail('追走・千切れはtrue/false/nullのみです');if(o.followed===true&&o.dropped===true)fail('追走成功と千切れは同時に指定できません');if((o.followed!==null||o.dropped!==null)&&(!text(o.resultSource)||!time(o.reviewedAt)||Date.parse(o.reviewedAt)<Date.parse(o.date+'T00:00:00+09:00')||Date.parse(o.reviewedAt)>Date.now()))fail('結果には出典・当日以降かつ未来でない確認時刻が必要です');for(const k of ['leaderPref','followerPref'])if(o[k]!==null&&!regionsByPref[o[k]])fail('記録内の所属県が不正です');}
if(!unique(d.observations,o=>[o.raceId,o.leader,o.follower].join('|')))fail('同一連係記録が重複しています');return true}
try{const saved=JSON.parse(localStorage.getItem(LIVE_STORE)||'null');if(saved){checkEvidence(saved);evidence=saved}}catch(e){liveMeta.storageWarning='保存済み観測記録を読めません。上書き前にバックアップを確認してください。'}
function persistEvidence(){checkEvidence(evidence);try{localStorage.setItem(LIVE_STORE,JSON.stringify(evidence));return true}catch(e){tell('保存容量不足・保存不可です。観測JSONを書き出してください。');return false}}
function mapIndex(raw){if(raw?.schema_version!=='1.0'||raw.domain!=='keirin'||!Array.isArray(raw.races)||raw.races.length>10000||raw.races_count!==raw.races.length||!unique(raw.races,x=>x.race_key))fail('一覧JSONの構造・件数が想定と異なります');return raw.races.map(x=>{if(!/^[a-z0-9]+-\d{8}-\d{1,2}$/.test(x.race_key)||!day(x.race_date)||!text(x.place)||!Number.isInteger(x.race_no)||x.race_no<1||x.race_no>12)fail('レース一覧の値が不正です');return {id:x.race_key,date:x.race_date,start:null,region:venueRegion[x.place]||'未分類',venue:x.place,round:x.race_no+'R',grade:x.grade??'',url:PROVIDER+'/'+x.race_key+'/',riders:[],lineLabels:[],detailsLoaded:false,top:x.top??null}})}
function mapDetail(raw,r){if(raw?.schema_version!=='1.0'||raw.domain!=='keirin'||raw.race_key!==r.id||raw.race_date!==r.date||raw.place!==r.venue||!Array.isArray(raw.predictions)||raw.predictions.length<2||raw.predictions.length>9||!unique(raw.predictions,p=>p.id)||!unique(raw.predictions,p=>p.racer_id))fail('詳細JSONの構造・レース対応が不正です');const riders=raw.predictions.map(p=>{if(!Number.isInteger(p.id)||p.id<1||p.id>9||!/^\d{6}$/.test(p.racer_id)||!finite(p.score,0,100))fail('詳細選手の車番・ID・スコアが不正です');return {no:p.id,id:p.racer_id,name:'登録番号 '+p.racer_id,line:null,position:null,observationScore:p.score}}).sort((a,b)=>a.no-b.no);let lines=raw.meta?.lines;if(lines!==undefined&&!Array.isArray(lines))fail('ライン情報の形式が不正です');const seen=new Set(),labels=[];for(const [i,l] of (lines||[]).entries()){if(!Array.isArray(l.members)||!l.members.length||l.members.length>9)fail('ラインmembersの形式が不正です');labels.push(typeof l.label==='string'?l.label:'ライン '+(i+1));for(const [j,id] of l.members.entries()){const rider=riders.find(x=>x.id===id);if(!rider||seen.has(id))fail('ライン内の選手IDが不明または重複しています');seen.add(id);rider.line=i+1;rider.position=j+1}}return {...r,riders,lineLabels:labels,detailsLoaded:true}}
let requestQueue=Promise.resolve(),lastRequest=0;
function providerJSON(path){const job=requestQueue.then(async()=>{const pause=Math.max(0,1500-(Date.now()-lastRequest));if(pause)await new Promise(resolve=>setTimeout(resolve,pause));lastRequest=Date.now();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(PROVIDER+path,{mode:'cors',credentials:'omit',signal:controller.signal});if(!response.ok)throw Error('配信元 HTTP '+response.status);const body=await response.text();if(body.length>4*1024*1024)fail('配信データが上限を超えています');return {json:JSON.parse(body),fetchedAt:new Date().toISOString(),lastModified:response.headers.get('Last-Modified')}}finally{clearTimeout(timer)}});requestQueue=job.catch(()=>{});return job}
async function loadLive(){if(indexBusy)return;if(liveMeta.fetchedAt&&Date.now()-Date.parse(liveMeta.fetchedAt)<600000){source='live';$('#source').value='live';$('#date').value=[...live.races].map(r=>r.date).sort().pop()||today;render();tell('10分以内の取得済み一覧を表示します。');return}indexBusy=true;$('#loadLive').disabled=true;$('#liveStatus').textContent='配信元から一覧を取得中…';try{const res=await providerJSON('/index.json'),races=mapIndex(res.json);live={races,history:[],bets:[]};detailState={};liveMeta={...liveMeta,...res,json:undefined,error:null};source='live';$('#source').value='live';$('#date').value=races.map(r=>r.date).sort().pop()||today;selected=null;render();tell(races.length+'レースを取得しました。')}catch(e){liveMeta.error=e.name==='AbortError'?'15秒でタイムアウトしました':e.message;$('#liveStatus').textContent='取得失敗：'+liveMeta.error+'。前回の一覧があれば保持しています。';tell('実データ取得失敗。自動再試行はしません。')}finally{indexBusy=false;$('#loadLive').disabled=false}}
async function loadDetail(id,retry=false){if(detailState[id]&&!retry)return;detailState[id]={state:'loading'};renderLivePanel();try{const res=await providerJSON('/'+encodeURIComponent(id)+'.json');const i=live.races.findIndex(r=>r.id===id);if(i<0)return;live.races[i]={...mapDetail(res.json,live.races[i]),fetchedAt:res.fetchedAt};detailState[id]={state:'ready'};}catch(e){detailState[id]={state:'error',error:e.name==='AbortError'?'取得タイムアウト':e.message}}if(source==='live'){render()}}
function liveGroups(r){const map={};r.riders.filter(x=>x.line!==null).forEach(x=>(map[x.line]??=[]).push(x));return Object.values(map).map(g=>g.sort((a,b)=>a.position-b.position))}
function livePairs(r){return liveGroups(r).flatMap(g=>g.slice(1).map((x,i)=>[g[i],x]))}
function previousEvidence(a,b,r){return evidence.observations.filter(o=>o.leader===a&&o.follower===b&&o.date<r.date&&o.raceId!==r.id)}
function displayName(x){return profile(x.id)?.name||x.name}
function evidenceTable(r){return table(['先頭 → 追走','過去連係','番手連係','追走成功 / 既知件数','番手追走 / 既知件数','千切れ / 既知件数','同県 / 同地区'],livePairs(r).map(([a,b])=>{const rows=previousEvidence(a.id,b.id,r),f=rateKnown(rows,'followed'),d=rateKnown(rows,'dropped'),bante=rateKnown(rows.filter(x=>x.position===2),'followed'),pa=profile(a.id)?.prefecture,pb=profile(b.id)?.prefecture;return tr([esc(displayName(a))+' → '+esc(displayName(b)),rows.length,rows.filter(x=>x.position===2).length,(f.n?pct(f.value):'データ不足')+' / '+f.n,(bante.n?pct(bante.value):'データ不足')+' / '+bante.n,(d.n?pct(d.value):'データ不足')+' / '+d.n,pa&&pb?(pa===pb?'同県':'別県')+' / '+(sameRegion(pa,pb)?'同地区':'別地区'):'所属県データ不足'])}))}
function storeLineup(){const r=race();if(!r?.detailsLoaded||!livePairs(r).length){tell('ライン情報がありません');return}if(evidence.observations.length+livePairs(r).length>30000){tell('観測記録の上限30000件に達しました。書き出して整理してください。');return}let added=0;for(const [a,b] of livePairs(r)){if(evidence.observations.some(x=>x.raceId===r.id&&x.leader===a.id&&x.follower===b.id))continue;evidence.observations.push({id:r.id+'_'+a.id+'_'+b.id,raceId:r.id,date:r.date,leader:a.id,follower:b.id,position:b.position,leaderPref:profile(a.id)?.prefecture||null,followerPref:profile(b.id)?.prefecture||null,followed:null,dropped:null,source:r.url,observedAt:new Date().toISOString(),resultSource:null,reviewedAt:null});added++}const saved=persistEvidence();tell(added+'件を'+(saved?'保存':'セッションへ追加')+'。追走・千切れ結果は未観測です。');renderLivePanel()}
const baseRender=render,basePanel=renderPanel,baseSourceChange=$('#source').onchange,baseExport=$('#export').onclick;
render=function(){if(source!=='live'){baseRender();return}$('#provenance').textContent='実取得データ / 第三者配信：競輪 観測ラボ（yomisuji）。公式APIではありません。観測スコアは的中確率ではありません。二次利用条件未確認。';let list=live.races.filter(r=>r.date===$('#date').value&&(!$('#region').value||r.region===$('#region').value));if(!list.some(x=>x.id===selected))selected=list[0]?.id;$('#races').innerHTML=list.map(r=>`<button class="race ${r.id===selected?'active':''}" data-race="${esc(r.id)}"><small>${esc(r.region)} · 時刻未取得</small><strong>${esc(r.venue)} ${esc(r.round)}</strong><small>${esc(r.grade)} / 配信元データ</small></button>`).join('')||'<p class="empty">この日の登録レースはありません。取得した最新開催日を選んでください。</p>';const r=race();$('#raceHeader').innerHTML=r?`<span class="badge">実取得 / ${esc(r.date)}</span><h2>${esc(r.venue)} ${esc(r.round)}</h2><p>発走時刻未取得 / オッズ未接続 / 予測確率未検証</p><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">配信元のレース情報</a>`:'<h3>実データ未選択</h3>';$('#stats').innerHTML=`<div class="stat"><small>取得レース</small><b>${live.races.length}</b></div><div class="stat"><small>取得日時（日本時間）</small><b style="font-size:15px">${liveMeta.fetchedAt?esc(new Date(liveMeta.fetchedAt).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})):'未取得'}</b></div><div class="stat"><small>提供元のデータ更新日時</small><b style="font-size:18px">不明</b></div>`;$('#liveStatus').textContent=(liveMeta.error?'前回の取得エラー：'+liveMeta.error+' / ':'')+(liveMeta.fetchedAt?'一覧'+live.races.length+'件、最新開催日 '+live.races.map(x=>x.date).sort().pop()+(live.races.map(x=>x.date).sort().pop()<today?'。最新開催日は本日より前です。今日のレース予想には使えません。':'。当日データとは限りません。'):'「実データを取得」で接続します。');renderLivePanel();if(r&&!r.detailsLoaded&&!detailState[r.id])void loadDetail(r.id)};
renderPanel=function(){if(source==='live'){renderLivePanel();return}if(tab==='observations'){$('#panel').innerHTML='<section class="card">連係記録は実取得データ専用です。実データモードへ切り替えてください。</section>';return}basePanel()};
function renderLivePanel(){if(source!=='live')return;const p=$('#panel'),r=race();if(tab==='data'){renderLiveData();return}if(tab==='observations'){renderObservations();return}if(tab==='value'){p.innerHTML='<section class="card"><h3>オッズ期待値：データ不足</h3><p class="notice">実オッズは未接続、予測確率は未検証です。配信元の観測スコアを確率へ変換しません。実データモードでは買い候補を生成しません。</p><p>手入力の仮説計算はサンプル／取り込みモードで利用できます。その入力は検証済み予測ではありません。</p></section>';return}if(tab==='backtest'){p.innerHTML='<section class="card"><h3>仮想バックテスト：データ不足</h3><p>この配信の一覧・詳細JSONには、事前の検証済み確率・オッズ・確定払戻がありません。観測スコアで払戻シミュレーションは行いません。</p></section>';return}if(!r){p.innerHTML='<section class="card">「実データを取得」で一覧を取得するか、日付を選んでください。</section>';return}if(!r.detailsLoaded){const s=detailState[r.id];p.innerHTML=`<section class="card"><h3>選手・ライン詳細</h3><p>${s?.state==='error'?'取得失敗：'+esc(s.error):'詳細を取得中…'}</p>${s?.state==='error'?'<button id="retryDetail">この詳細だけ再取得</button>':''}</section>`;if($('#retryDetail'))$('#retryDetail').onclick=()=>loadDetail(r.id,true);return}if(tab==='scenario'){p.innerHTML=`<section class="card"><h3>展開シナリオ</h3><p class="notice">ライン順に基づく検討用仮説です。確率・実際の展開を推定したものではありません。</p>${liveGroups(r).map(g=>`<div class="stat" style="margin:12px 0">${esc(displayName(g[0]))}が主導権を取る仮説。${g[1]?esc(displayName(g[1]))+'が番手を追走する想定。':'単騎構成。'} 追走結果・風・脚質は未取得。</div>`).join('')||'<p>ライン情報不足</p>'}</section>`;return}
p.innerHTML=`<section class="card"><h3>実取得のライン構成</h3><p class="muted">membersの配列順を並び順として表示。所属県をライン名から推測しません。氏名は配信JSONにないため登録番号で表示します。</p>${liveGroups(r).map(g=>`<h4>${esc(r.lineLabels[g[0].line-1])}</h4><div class="line">${g.map(x=>`<div class="rider"><b>${x.no}</b>${esc(displayName(x))}<small> / ${x.position===1?'先頭':x.position===2?'番手':'三番手以降'}</small></div>`).join(' → ')}</div>`).join('')||'<p>ライン情報未取得</p>'}${r.riders.some(x=>x.line===null)?'<p class="warn">ライン所属不明の車番：'+r.riders.filter(x=>x.line===null).map(x=>x.no).join('、')+'</p>':''}${table(['車番','選手登録番号','観測スコア（確率ではない）','所属県（手動資料）'],r.riders.map(x=>tr([x.no,esc(x.id),x.observationScore.toFixed(2),esc(profile(x.id)?.prefecture||'未取得')])))}<button id="saveLineup" class="primary">このラインを連係観測として保存</button><p class="muted">ライン編成を保存します。出走・追走成功・千切れを確認した記録ではありません。</p></section><section class="card"><h3>保存済みの過去連係・同県／同地区</h3>${evidenceTable(r)}<p class="muted">選択レースの前日までの同じ順序の隣接ペアを集計。追走率・千切れ率の分母は各項目の既知結果件数です。未観測を失敗に数えません。同県・同地区は現在の手動所属資料の比較です。</p></section>`;$('#saveLineup').onclick=storeLineup}
function renderLiveData(){$('#panel').innerHTML=`<section class="card"><h3>配信元・構造・条件の確認</h3><p><a href="${PROVIDER}/index.json" target="_blank" rel="noopener noreferrer">レース一覧JSON</a> / <a href="${PROVIDER}/about/" target="_blank" rel="noopener noreferrer">運営情報</a> / <a href="${PROVIDER}/robots.txt" target="_blank" rel="noopener noreferrer">robots.txt</a></p><p>schema_version=1.0。一覧は races[] に race_key / race_date / race_no / place / grade / top。詳細は /{race_key}.json の predictions[] と meta.lines[].members。</p><p>取得確認時のCORSは一覧・詳細とも Access-Control-Allow-Origin: *。キャッシュは600秒。JSONに更新日時フィールドなし、HTTP Last-Modifiedも確認できません。画面の取得日時は更新日時ではありません。</p><p class="notice">二次利用・再配布を明示的に許可するライセンスは未確認です。CORS許可は利用許諾ではありません。robots.txtには ai-train=no / use=reference の指定があります。このアプリはAI学習や生データの再配信をせず、操作時に配信元へ直接アクセスします。公開運用や再配布の条件は提供者へ確認してください。</p><p>最小1.5秒の直列取得。選択レースのみ詳細取得。一覧は10分以内の再取得を抑止。取得失敗時は自動再試行しません。配信データはセッション内のみで保持します。</p><p>オッズ：未接続。検証済み確率：未接続。氏名・所属県・追走結果：JSONに未収録。</p></section>`}
function observationSummary(){const r=race(),rows=evidence.observations.filter(o=>!r||o.date<r.date);return table(['保存時の所属関係','連係件数','番手追走 / 既知件数','千切れ / 既知件数'],['同県','同地区・別県','別地区','所属不明'].map(label=>{const all=rows.filter(o=>{const a=o.leaderPref,b=o.followerPref;return (!a||!b?'所属不明':a===b?'同県':sameRegion(a,b)?'同地区・別県':'別地区')===label}),f=rateKnown(all.filter(o=>o.position===2),'followed'),d=rateKnown(all,'dropped');return tr([label,all.length,(f.n?pct(f.value):'データ不足')+' / '+f.n,(d.n?pct(d.value):'データ不足')+' / '+d.n])}))}
function renderObservations(){const r=race(),options=r?.riders.map(x=>`<option value="${esc(x.id)}">${x.no}番 ${esc(x.id)}</option>`).join('')||'';$('#panel').innerHTML=`<section class="card"><h3>選手所属資料と連係観測の保存</h3><p class="muted">サンプルと混在しません。所属県・氏名は根拠資料から手入力し、履歴の保存時点で所属を記録します。</p><div class="controls"><label>選手<select id="profileId">${options}</select></label><label>氏名<input id="profileName" maxlength="100"></label><label>所属県<select id="profilePref"><option value="">選択</option>${Object.keys(regionsByPref).map(p=>`<option>${p}</option>`).join('')}</select></label><label>出典（URL・資料名）<input id="profileSource" maxlength="200"></label><button id="saveProfile">所属資料を保存</button></div><p id="profileInfo" class="muted"></p><details><summary>保存済み所属資料</summary>${table(['ID','氏名','所属県','地区','出典'],evidence.profiles.map(x=>tr([esc(x.id),esc(x.name),esc(x.prefecture),esc(regionsByPref[x.prefecture]),esc(x.source)])))}</details><div class="controls"><button id="exportEvidence">観測記録JSONを書き出す</button><label>観測記録JSONを取り込む<input id="evidenceFile" type="file" accept="application/json,.json"></label><button id="deleteEvidence" class="bad">全観測記録を削除</button></div><p>記録 ${evidence.observations.length}件。保存先はこのブラウザのlocalStorageです。バックアップJSONには手動資料・観測記録を含みます。公開共有の可否は出典条件を確認してください。</p></section><section class="card"><h3>保存時の同県・同地区別集計</h3><p>選択レースがあればその前日まで、未選択なら全期間。未観測は率の分母から除外します。</p>${observationSummary()}</section><section class="card"><h3>追走・千切れの確認結果</h3><p>ラインを保存しただけでは結果は不明です。レース映像・結果資料で確認し、項目ごとに判定してください。確定した追走成功と千切れの同時trueは拒否します。</p><div class="controls"><label>対象の観測<select id="observationId">${evidence.observations.map(o=>`<option value="${esc(o.id)}">${esc(o.date+' '+o.raceId+' '+o.leader+'→'+o.follower)}</option>`).join('')}</select></label><label>追走成功<select id="followed"><option value="">未観測</option><option value="true">成功</option><option value="false">失敗</option></select></label><label>千切れ<select id="dropped"><option value="">未観測</option><option value="true">あり</option><option value="false">なし</option></select></label><label>確認資料<input id="resultSource" maxlength="200"></label><button id="saveResult">確認結果を保存</button></div><details><summary>全記録の状況</summary>${table(['開催日','ペア','位置','追走','千切れ','保存時の同県 / 同地区'],evidence.observations.map(o=>tr([esc(o.date),esc(o.leader+'→'+o.follower),o.position===2?'番手':'三番手以降',o.followed===null?'未観測':o.followed?'成功':'失敗',o.dropped===null?'未観測':o.dropped?'あり':'なし',o.leaderPref&&o.followerPref?(o.leaderPref===o.followerPref?'同県':'別県')+' / '+(sameRegion(o.leaderPref,o.followerPref)?'同地区':'別地区'):'不明'])))}</details></section>`;
const fillProfile=()=>{const p=profile($('#profileId').value);$('#profileName').value=p?.name||'';$('#profilePref').value=p?.prefecture||'';$('#profileSource').value=p?.source||'';$('#profileInfo').textContent=p?'保存済みの手動資料です。':'配信元JSONに氏名・所属県はありません。'};$('#profileId').onchange=fillProfile;fillProfile();$('#saveProfile').onclick=()=>{const p={id:$('#profileId').value,name:$('#profileName').value.trim(),prefecture:$('#profilePref').value,source:$('#profileSource').value.trim()};try{const next={...evidence,profiles:[...evidence.profiles.filter(x=>x.id!==p.id),p]};checkEvidence(next);evidence=next;const saved=persistEvidence();tell(saved?'所属資料を保存しました':'セッション内に追加しました');renderObservations()}catch(e){tell(e.message)}};
const fillResult=()=>{const o=evidence.observations.find(x=>x.id===$('#observationId').value);$('#followed').value=o?.followed==null?'':String(o.followed);$('#dropped').value=o?.dropped==null?'':String(o.dropped);$('#resultSource').value=o?.resultSource||''};$('#observationId').onchange=fillResult;fillResult();$('#saveResult').onclick=()=>{const id=$('#observationId').value,o=evidence.observations.find(x=>x.id===id);if(!o){tell('先にラインを連係観測として保存してください');return}const b=v=>v===''?null:v==='true',f=b($('#followed').value),d=b($('#dropped').value),updated={...o,followed:f,dropped:d,resultSource:f===null&&d===null?null:$('#resultSource').value.trim(),reviewedAt:f===null&&d===null?null:new Date().toISOString()};try{const next={...evidence,observations:evidence.observations.map(x=>x.id===id?updated:x)};checkEvidence(next);evidence=next;const saved=persistEvidence();tell(saved?'確認結果を保存しました':'セッション内で更新しました');renderObservations()}catch(e){tell(e.message)}};
$('#exportEvidence').onclick=()=>download('keirin-observations.json',JSON.stringify(evidence,null,2),'application/json');$('#evidenceFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)fail('5MB以下にしてください');const next=JSON.parse(await f.text());checkEvidence(next);evidence=next;const saved=persistEvidence();renderObservations();tell(saved?'観測記録を置換しました':'セッション内で置換しました')}catch(e){tell('取り込み失敗：'+e.message)}};$('#deleteEvidence').onclick=()=>{if(!confirm('所属資料と全連係記録を削除します。よろしいですか？'))return;try{localStorage.removeItem(LIVE_STORE);evidence={version:1,profiles:[],observations:[]};renderObservations();tell('観測記録を削除しました')}catch(e){tell('保存領域を削除できませんでした')}}}
$('#source').value=source;
$('#loadLive').onclick=loadLive;
$('#source').onchange=e=>{if(e.target.value==='live'){source='live';$('#date').value=live.races.map(r=>r.date).sort().pop()||today;render()}else baseSourceChange(e)};
$('#export').onclick=()=>source==='live'?download('keirin-observations.json',JSON.stringify(evidence,null,2),'application/json'):baseExport();
render();
</script>
</body></html>
